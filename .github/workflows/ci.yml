name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Native modules and the Electron binary are not needed for these steps
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

  e2e:
    name: End-to-end smoke test (Electron)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Full install: downloads Electron and rebuilds sqlite3 for it (postinstall)
      - run: npm ci
      - run: npx electron-vite build
      - run: xvfb-run -a npx playwright test
